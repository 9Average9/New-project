<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arcanum — D&amp;D Character Forge</title>
  <meta name="description" content="A premium one-shot Dungeons &amp; Dragons character forge — pick a race, class and level to instantly create a hero.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#efe3c6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcanum">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

  <!-- Premium fantasy typography (loads in-browser; degrades to serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer bg-vignette" aria-hidden="true"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-block">
      <span class="brand-flourish">✦ ✦ ✦</span>
      <h1 class="brand">Arcanum</h1>
      <p class="tagline">Forge a legend in three heartbeats</p>
    </div>
    <div class="header-actions">
      <button class="compendium-toggle" onclick="toggleHeroes()">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/></svg>
        <span>Heroes</span>
        <span class="badge zero" id="heroes-badge"></span>
      </button>
      <button class="compendium-toggle" onclick="toggleCompendium()">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4c2-1 6-1 8 .5C14 3 18 3 20 4v15c-2-1-6-1-8 .5C10 18 6 18 4 19V4z"/></svg>
        <span>Compendium</span>
      </button>
    </div>
  </header>

  <!-- Forge / picker -->
  <main class="forge">
    <section class="step">
      <div class="step-head">
        <span class="step-num">I</span>
        <h2>Choose your Race</h2>
        <span class="step-pick" id="race-pick">—</span>
      </div>
      <div class="card-grid" id="race-grid"></div>
    </section>

    <section class="step">
      <div class="step-head">
        <span class="step-num">II</span>
        <h2>Choose your Class</h2>
        <span class="step-pick" id="class-pick">—</span>
      </div>
      <div class="card-grid" id="class-grid"></div>
    </section>

    <section class="step">
      <div class="step-head">
        <span class="step-num">III</span>
        <h2>Choose your Level</h2>
        <span class="step-pick">10 – 20</span>
      </div>
      <div class="level-picker">
        <button class="level-btn" id="level-minus" onclick="changeLevel(-1)" aria-label="Lower level">
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
        <div class="level-display">
          <span class="level-word">Level</span>
          <span class="level-value" id="level-value">10</span>
        </div>
        <button class="level-btn" id="level-plus" onclick="changeLevel(1)" aria-label="Raise level">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </section>

    <div class="forge-actions">
      <button id="forge-btn" class="btn-forge" disabled onclick="forgeCharacter()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M14.5 3H21v6.5L10 20.5l-2.5-2.5L18.5 7V3zM4 15l3 3-2 3H2v-3l2-3z"/></svg>
        <span>Forge Character</span>
      </button>
      <p class="forge-hint">Pick a race and a class to light the forge.</p>
    </div>
  </main>

  <!-- Generated character sheet (populated by code.js) -->
  <section id="sheet" class="sheet hidden"></section>

  <footer class="app-footer">
    <span>Arcanum · a premium one-shot character forge</span>
  </footer>

  <!-- Portrait lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Close">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <img id="lightbox-img" alt="Character portrait">
  </div>

  <!-- Shared scrim -->
  <div id="scrim" class="scrim" onclick="closeAllDrawers()"></div>

  <!-- Saved Heroes drawer -->
  <aside id="heroes" class="drawer" aria-label="Saved heroes">
    <div class="drawer-head">
      <h2>Saved Heroes</h2>
      <button class="drawer-close" onclick="closeHeroes()" aria-label="Close saved heroes">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body"><div id="hero-list" class="hero-list"></div></div>
  </aside>

  <!-- Compendium drawer -->
  <aside id="compendium" class="drawer" aria-label="Compendium">
    <div class="drawer-head">
      <h2>Compendium</h2>
      <button class="drawer-close" onclick="closeCompendium()" aria-label="Close compendium">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="comp-tabs">
      <button class="comp-tab active" data-tab="spells" onclick="showCompTab('spells')">Spells &amp; Actions</button>
      <button class="comp-tab" data-tab="weapons" onclick="showCompTab('weapons')">Weapons</button>
    </div>
    <div class="drawer-body">
      <div id="comp-spells"></div>
      <div id="comp-weapons" class="hidden"></div>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="code.js"></script>
</body>
</html>
